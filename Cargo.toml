[workspace]
members = [".", "mindbreake-wasm"]
resolver = "2"

[package]
name = "mindbreake"
version = "0.1.0"
edition = "2021"
description = "Moteur de règles façon Mindbug : réducteur pur, cartes typées, IA Monte Carlo"
license = "MIT"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3

# WASM build: small binary, via `cargo build --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
